<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Gợi ý Khóa học CNTT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .panel-header {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 20px;
            font-size: 1.3em;
            font-weight: 500;
        }

        .panel-content {
            padding: 25px;
            max-height: 500px;
            overflow-y: auto;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .course-item {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .course-item:hover {
            border-color: #3498db;
            background: #e3f2fd;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.2);
        }

        .course-item.selected {
            border-color: #27ae60;
            background: linear-gradient(135deg, #d5f4e6, #c8e6c9);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.2);
        }

        .course-code {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .course-name {
            color: #7f8c8d;
            margin: 5px 0;
            font-size: 0.95em;
        }

        .course-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #95a5a6;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2980b9, #3498db);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #7f8c8d, #95a5a6);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(149, 165, 166, 0.3);
        }

        .model-selector {
            margin-bottom: 20px;
        }

        .model-selector label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .model-selector label:hover {
            background: #f8f9fa;
        }

        .model-selector input[type="radio"] {
            width: 18px;
            height: 18px;
        }

        .recommendation-item {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
            transition: all 0.3s ease;
        }

        .recommendation-item:hover {
            border-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .rec-code {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.2em;
        }

        .rec-priority {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .rec-name {
            color: #34495e;
            font-size: 1.1em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .rec-info {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .rec-reason {
            background: #e8f5e8;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border-left-color: #28a745;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            
            .course-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Hệ thống Gợi ý Khóa học CNTT</h1>
            <p>Trí tuệ nhân tạo trong Giáo dục - Đồ án AI</p>
        </div>

        <div class="main-content">
            <!-- Panel chọn môn học -->
            <div class="panel">
                <div class="panel-header">
                    📚 Chọn môn học đã hoàn thành
                </div>
                <div class="panel-content">
                    <div class="controls">
                        <button class="btn btn-secondary" onclick="selectAll()">
                            ✓ Chọn tất cả
                        </button>
                        <button class="btn btn-secondary" onclick="clearAll()">
                            ✗ Bỏ chọn tất cả
                        </button>
                    </div>

                    <div id="coursesContainer" class="course-grid">
                        <!-- Courses will be loaded here -->
                    </div>

                    <div class="model-selector">
                        <h3 style="margin-bottom: 15px; color: #2c3e50;">🤖 Chọn mô hình AI:</h3>
                        <label>
                            <input type="radio" name="model" value="baseline" checked>
                            <div>
                                <strong>Baseline Model</strong><br>
                                <small>Tìm kiếm trên đồ thị (BFS/DFS)</small>
                            </div>
                        </label>
                        <label>
                            <input type="radio" name="model" value="logic">
                            <div>
                                <strong>Logic-based Model</strong><br>
                                <small>Suy diễn logic vị từ</small>
                            </div>
                        </label>
                    </div>

                    <div class="controls">
                        <button class="btn btn-primary" onclick="getRecommendations()">
                            🔍 Lấy gợi ý môn học
                        </button>
                    </div>
                </div>
            </div>

            <!-- Panel hiển thị gợi ý -->
            <div class="panel">
                <div class="panel-header">
                    🎯 Gợi ý môn học
                </div>
                <div class="panel-content">
                    <div id="recommendationsContainer">
                        <div class="alert">
                            <strong>Hướng dẫn:</strong> Chọn các môn học đã hoàn thành ở bên trái, sau đó nhấn "Lấy gợi ý môn học" để xem các môn học được đề xuất.
                        </div>
                        
                        <div class="stats-container" id="statsContainer" style="display: none;">
                            <!-- Statistics will be shown here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let coursesData = {};
        let selectedCourses = new Set();

        // Load dữ liệu môn học khi trang được tải
        document.addEventListener('DOMContentLoaded', function() {
            loadCourses();
        });

        async function loadCourses() {
            try {
                const response = await fetch('http://localhost:5000/api/courses');
                coursesData = await response.json();
                displayCourses();
            } catch (error) {
                console.error('Lỗi khi tải dữ liệu:', error);
                document.getElementById('coursesContainer').innerHTML = 
                    '<div class="alert">Lỗi khi tải dữ liệu môn học!</div>';
            }
        }

        function displayCourses() {
            const container = document.getElementById('coursesContainer');
            const courses = coursesData.courses;
            
            let html = '';
            for (const [code, info] of Object.entries(courses)) {
                html += `
                    <div class="course-item" onclick="toggleCourse('${code}')" id="course-${code}">
                        <div class="course-code">${code}</div>
                        <div class="course-name">${info.name}</div>
                        <div class="course-info">
                            <span>📖 ${info.credits} tín chỉ</span>
                            <span>📅 HK${info.semester}</span>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        function toggleCourse(courseCode) {
            const element = document.getElementById(`course-${courseCode}`);
            
            if (selectedCourses.has(courseCode)) {
                selectedCourses.delete(courseCode);
                element.classList.remove('selected');
            } else {
                selectedCourses.add(courseCode);
                element.classList.add('selected');
            }
        }

        function selectAll() {
            selectedCourses.clear();
            const courses = Object.keys(coursesData.courses);
            courses.forEach(code => {
                selectedCourses.add(code);
                document.getElementById(`course-${code}`).classList.add('selected');
            });
        }

        function clearAll() {
            selectedCourses.clear();
            const elements = document.querySelectorAll('.course-item');
            elements.forEach(element => {
                element.classList.remove('selected');
            });
        }

        async function getRecommendations() {
            if (selectedCourses.size === 0) {
                alert('Vui lòng chọn ít nhất một môn học đã hoàn thành!');
                return;
            }

            const container = document.getElementById('recommendationsContainer');
            const selectedModel = document.querySelector('input[name="model"]:checked').value;
            
            // Hiển thị loading
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Đang phân tích và tạo gợi ý...</p>
                </div>
            `;

            try {
                const response = await fetch('http://localhost:5000/api/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        completed_courses: Array.from(selectedCourses),
                        model: selectedModel,
                        max_recommendations: 5
                    })
                });

                const data = await response.json();
                displayRecommendations(data);

            } catch (error) {
                console.error('Lỗi khi lấy gợi ý:', error);
                container.innerHTML = '<div class="alert">Lỗi khi lấy gợi ý môn học!</div>';
            }
        }

        function displayRecommendations(data) {
            const container = document.getElementById('recommendationsContainer');
            
            if (data.recommendations.length === 0) {
                container.innerHTML = `
                    <div class="alert success">
                        <strong>🎉 Chúc mừng!</strong><br>
                        Bạn đã hoàn thành tất cả các môn học có thể hoặc không có môn nào phù hợp với điều kiện hiện tại.
                    </div>
                `;
                return;
            }

            let html = `
                <div class="alert success">
                    <strong>Mô hình đã sử dụng:</strong> ${data.model_used === 'baseline' ? 'Baseline (Tìm kiếm đồ thị)' : 'Logic-based (Suy diễn logic)'}<br>
                    <strong>Số môn đã hoàn thành:</strong> ${data.completed_courses_count} môn<br>
                    <strong>Số gợi ý:</strong> ${data.recommendations.length} môn
                </div>
            `;

            data.recommendations.forEach((rec, index) => {
                html += `
                    <div class="recommendation-item">
                        <div class="rec-header">
                            <div class="rec-code">${rec.code}</div>
                            ${rec.priority_score ? `<div class="rec-priority">Điểm: ${rec.priority_score}</div>` : ''}
                        </div>
                        <div class="rec-name">${rec.name}</div>
                        <div class="rec-info">
                            <span>📖 ${rec.credits} tín chỉ</span>
                            <span>📅 Học kỳ ${rec.semester}</span>
                            <span>🏆 Thứ tự: ${index + 1}</span>
                        </div>
                        <div class="rec-reason">${rec.reason}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Load thống kê khi trang được tải
        async function loadStatistics() {
            try {
                const response = await fetch('/api/course-analysis');
                const stats = await response.json();
                displayStatistics(stats);
            } catch (error) {
                console.error('Lỗi khi tải thống kê:', error);
            }
        }

        function displayStatistics(stats) {
            const container = document.getElementById('statsContainer');
            container.style.display = 'grid';
            
            container.innerHTML = `
                <div class="stat-item">
                    <div class="stat-number">${stats.total_courses}</div>
                    <div class="stat-label">Tổng số môn học</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${stats.total_prerequisites}</div>
                    <div class="stat-label">Môn có điều kiện tiên quyết</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${stats.average_credits.toFixed(1)}</div>
                    <div class="stat-label">Trung bình tín chỉ/môn</div>
                </div>
            `;
        }

        // Gọi hàm load thống kê
        loadStatistics();
    </script>
</body>
</html>
